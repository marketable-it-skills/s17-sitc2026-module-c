info:
  name: evaluate-ok
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/batteries/battery-001/evaluate-last-charge"
  headers:
    - name: Authorization
      value: "Bearer sl_tok_rider-001"
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("evaluate battery-001 is SAFE", function() {
          expect(res.status).to.equal(200);
          expect(res.body.batteryId).to.equal("battery-001");
          expect(res.body.outcome).to.equal("SAFE");
          expect(res.body.unitId).to.equal("unit-001");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
