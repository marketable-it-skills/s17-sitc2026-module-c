info:
  name: start-charging-service
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/services/{{chargingServiceId}}/start"
  headers:
    - name: Authorization
      value: Bearer sl_tok_rider-002
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("POST /services/{id}/start charging → CHARGING", function() {
          expect(res.status).to.equal(200);
          expect(res.body.type).to.equal("CHARGING");
          expect(res.body.state).to.equal("CHARGING");
          expect(res.body.startedAt).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
