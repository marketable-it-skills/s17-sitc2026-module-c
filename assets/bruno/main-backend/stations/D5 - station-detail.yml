info:
  name: "D5 - station-detail"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/stations/station-001"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("D5 - GET /stations/{id} returns detail with compatibility", function() {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal("station-001");
          expect(res.body.type).to.equal("HYBRID");
          expect(res.body.compatibility.services).to.include.members(["SWAP", "BIKE_BAY"]);
          expect(res.body.compatibility.batteryTypes).to.include("SL-48");
          expect(res.body.compatibility.connectorTypes).to.include("GB-AC-48");
          expect(res.body.compatibility.voltageClasses).to.include("48V");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
