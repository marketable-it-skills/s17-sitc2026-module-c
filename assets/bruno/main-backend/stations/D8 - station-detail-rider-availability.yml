info:
  name: "D8 - station-detail-rider-availability"
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/stations/station-001"
  headers:
    - name: Authorization
      value: Bearer sl_tok_rider-001
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("D8 - GET /stations/{id} includes riderAvailability for SWAPPABLE rider", function() {
          expect(res.status).to.equal(200);
          expect(res.body.riderAvailability).to.deep.equal({
            compatibleReadyBattery: true,
            compatibleChargingBay: false
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
