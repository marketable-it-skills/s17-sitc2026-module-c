info:
  name: "G4 - evaluate-spike"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/batteries/battery-005/evaluate-last-charge"
  headers:
    - name: Authorization
      value: "Bearer sl_tok_rider-001"
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("G4 - POST /batteries/{id}/evaluate-last-charge returns QUARANTINED for spike telemetry", function() {
          expect(res.status).to.equal(200);
          expect(res.body.batteryId).to.equal("battery-005");
          expect(res.body.outcome).to.equal("QUARANTINED");
          expect(res.body.reason).to.equal("SPIKE");
          expect(res.body.unitId).to.equal("unit-009");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
