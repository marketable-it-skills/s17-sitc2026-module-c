info:
  name: F3 - wait-charging-ready
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/services/{{chargingServiceId}}/charging-status"
  headers:
    - name: Authorization
      value: Bearer sl_tok_rider-002
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Station Service DEFAULT_CHARGING_DURATION_SECONDS is 15; buffer past completion.
        // Use bru.sleep — plain setTimeout is not reliable in Bruno before-request scripts.
        await bru.sleep(17000);
    - type: tests
      code: |-
        test("F3 - GET /charging-status auto-transitions to READY_FOR_COLLECTION when Station Service completes", function() {
          expect(res.status).to.equal(200);
          expect(res.body.service).to.be.an("object");
          expect(res.body.service.type).to.equal("CHARGING");
          expect(res.body.service.state).to.equal("READY_FOR_COLLECTION");
          expect(res.body.charging).to.be.an("object");
          expect(res.body.charging.status).to.equal("COMPLETED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
