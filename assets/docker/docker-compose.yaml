services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - swaploop_mysql_data2:/var/lib/mysql
      - ../db/swaploop_db.sql:/docker-entrypoint-initdb.d/01-swaploop_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  station-service:
    image: ghcr.io/sitc2026-dev/s17-sitc2026-station-service:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${STATION_SERVICE_PORT}:${STATION_SERVICE_PORT}
    environment:
      PORT: ${STATION_SERVICE_PORT}
      # Used by `POST /reset` to restore Module C's canonical MySQL seed.
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${PHPMYADMIN_PORT}:80
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}

volumes:
  swaploop_mysql_data2:
